[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messina-info"
version = "0.1.0"
description = "Telegram export ingestion tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
messina-info = "messina_info.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
retrieval = ["sentence-transformers>=3,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
